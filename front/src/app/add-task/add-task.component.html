<div 
class="addTask"
(click)="activeEditor()"
*ngIf="!isActive"
>
    <div class="iconAdd">
        <svg width="13" height="13"><path fill="currentColor" fill-rule="evenodd" d="M6 6V.5a.5.5 0 0 1 1 0V6h5.5a.5.5 0 1 1 0 1H7v5.5a.5.5 0 1 1-1 0V7H.5a.5.5 0 0 1 0-1H6z"></path></svg>
    </div>

    <p>Добавить задачу</p>
</div>

<div class="taskEditor" *ngIf="isActive">
    <div class="editingArea">
        <input class="title" type="text" [(ngModel)]="title" placeholder="Название задачи">
        <input class="description" type="text" [(ngModel)]="description" placeholder="Описание">

        <div class="settings">
            <div class="setting">
                <div [class.active]="settings.period"  (click)="toggleSetting('period')">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M12 2a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8zm0 1H4a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V4a1 1 0 0 0-1-1zm-1.25 7a.75.75 0 1 1 0 1.5.75.75 0 0 1 0-1.5zm.75-5a.5.5 0 1 1 0 1h-7a.5.5 0 0 1 0-1h7z"></path></svg>
                    <p>Срок</p>
                </div>
            </div>

            <div class="setting">
                <div [class.active]="settings.priority" (click)="toggleSetting('priority')">
                    <svg class="p{{activePriority}}" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 16 16" data-icon-name="priority-icon" data-priority="4"><path fill="currentColor" fill-rule="evenodd" d="M2 3a.5.5 0 0 1 .276-.447C3.025 2.179 4.096 2 5.5 2c.901 0 1.485.135 2.658.526C9.235 2.885 9.735 3 10.5 3c1.263 0 2.192-.155 2.776-.447A.5.5 0 0 1 14 3v6.5a.5.5 0 0 1-.276.447c-.749.375-1.82.553-3.224.553-.901 0-1.485-.135-2.658-.526C6.765 9.615 6.265 9.5 5.5 9.5c-1.08 0-1.915.113-2.5.329V13.5a.5.5 0 0 1-1 0V3Zm1 5.779v-5.45C3.585 3.113 4.42 3 5.5 3c.765 0 1.265.115 2.342.474C9.015 3.865 9.599 4 10.5 4c1.002 0 1.834-.09 2.5-.279v5.45c-.585.216-1.42.329-2.5.329-.765 0-1.265-.115-2.342-.474C6.985 8.635 6.401 8.5 5.5 8.5c-1.001 0-1.834.09-2.5.279Z" clip-rule="evenodd"></path></svg>
                    <p [innerText]="priority()">Приоритет</p>
                </div>

                <ul class="priorities" *ngIf="settings.priority">
                    <li 
                    *ngFor="let item of priorities; let i = index"
                    (click)="changePrior(i)"
                    >
                        <svg class="p{{i+1}}" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24" data-icon-name="priority-icon" data-priority="1"><path fill="currentColor" fill-rule="evenodd" d="M4.223 4.584A.5.5 0 0 0 4 5v14.5a.5.5 0 0 0 1 0v-5.723C5.886 13.262 7.05 13 8.5 13c.97 0 1.704.178 3.342.724 1.737.58 2.545.776 3.658.776 1.759 0 3.187-.357 4.277-1.084A.5.5 0 0 0 20 13V4.5a.5.5 0 0 0-.777-.416C18.313 4.69 17.075 5 15.5 5c-.97 0-1.704-.178-3.342-.724C10.421 3.696 9.613 3.5 8.5 3.5c-1.758 0-3.187.357-4.277 1.084Z" clip-rule="evenodd"></path></svg>
                        <p>Приоритет {{i+1}}</p>
                        <svg class="arrow" *ngIf="priorities[i]" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M4.902 6.975l4.182-4.244a.74.74 0 0 1 1.06 0 .775.775 0 0 1 0 1.081L5.432 8.597a.74.74 0 0 1-1.06 0L1.78 5.975a.775.775 0 0 1 0-1.081.74.74 0 0 1 1.061 0l2.06 2.081z"></path></svg>
                    </li>
                </ul>
            </div>

            <div class="setting">
                <div [class.active]="settings.tags"  (click)="toggleSetting('tags')">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 20 20" aria-hidden="true"><g transform="translate(-2,-1)"><path fill="currentColor" fill-rule="evenodd" d="m3.914 11.086 6.5-6.5A2 2 0 0 1 11.828 4H18a2 2 0 0 1 2 2v6.172a2 2 0 0 1-.586 1.414l-6.5 6.5a2 2 0 0 1-2.828 0l-6.172-6.172a2 2 0 0 1 0-2.828Zm.707.707a1 1 0 0 0 0 1.414l6.172 6.172a1 1 0 0 0 1.414 0l6.5-6.5a1 1 0 0 0 .293-.707V6a1 1 0 0 0-1-1h-6.172a1 1 0 0 0-.707.293l-6.5 6.5ZM14.75 10.5a1.25 1.25 0 1 0 0-2.5 1.25 1.25 0 0 0 0 2.5Z" clip-rule="evenodd"></path></g></svg>
                    <p>Метки</p>
                </div>

                <div class="tags" *ngIf="settings.tags">
                    <div class="tagInput">
                        <input type="text" placeholder="Введите метку" [(ngModel)]="newTag">
                    </div>

                    <ul class="tagList" *ngIf="!newTag">
                        <li *ngFor="let el of tags">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path fill="currentColor" fill-rule="evenodd" d="m3.914 11.086 6.5-6.5A2 2 0 0 1 11.828 4H18a2 2 0 0 1 2 2v6.172a2 2 0 0 1-.586 1.414l-6.5 6.5a2 2 0 0 1-2.828 0l-6.172-6.172a2 2 0 0 1 0-2.828Zm.707.707a1 1 0 0 0 0 1.414l6.172 6.172a1 1 0 0 0 1.414 0l6.5-6.5a1 1 0 0 0 .293-.707V6a1 1 0 0 0-1-1h-6.172a1 1 0 0 0-.707.293l-6.5 6.5ZM14.75 10.5a1.25 1.25 0 1 0 0-2.5 1.25 1.25 0 0 0 0 2.5Z" clip-rule="evenodd"></path></svg>
                            <p>{{el}}</p>
                            <svg (click)="deleteTag(el)" class="tagCancel" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M15.854 15.854a.5.5 0 0 0 0-.707L12.707 12l3.147-3.147a.5.5 0 0 0-.708-.707L12 11.293 8.854 8.147a.5.5 0 1 0-.708.707l3.147 3.147-3.147 3.146a.5.5 0 1 0 .708.707L12 12.708l3.146 3.146a.5.5 0 0 0 .708 0" clip-rule="evenodd"></path></svg>
                        </li>
                    </ul>

                    <button class="newTag" *ngIf="newTag" (click)="createTag()">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="currentColor" d="M12.5 6a.5.5 0 0 1 .5.5V12h5.5a.5.5 0 1 1 0 1H13v5.5a.5.5 0 1 1-1 0V13H6.5a.5.5 0 1 1 0-1H12V6.5a.5.5 0 0 1 .5-.5z"></path></svg>
                        <p>Создать "{{newTag}}"</p>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="footerEditor">
        <div class="collection"></div>

        <div class="buttons">
            <button class="cancel" (click)="disableEditor()">Отмена</button>
            <button class="add" (click)="addTask()">Добавить задачу</button>
        </div>
    </div>
</div>
