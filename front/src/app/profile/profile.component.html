<div class="profile">
    <div 
    class="user" 
    (click)="toggleStatus()"
    [class.active]="isActive"
    >
        <div class="username">
            <img src="./profile.jpg" alt=""> 
            <p>{{username}}</p> 
        </div>
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24" aria-hidden="true" class="_u3bMJW"><path fill="currentColor" d="M15.646 9.647a.5.5 0 0 1 .708.707l-4 4a.5.5 0 0 1-.708 0l-4-4a.5.5 0 1 1 .708-.707L12 13.294l3.646-3.647Z"></path></svg>
    </div>

    <div 
    class="options" 
    *ngIf="isActive"
    >
        <div class="option" (click)="logout()">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" aria-hidden="true"><g fill="none" fill-rule="evenodd"><path stroke="currentColor" d="M6.5 8.3V5.63c0-1.17.9-2.13 2-2.13h7c1.1 0 2 .95 2 2.13v11.74c0 1.17-.9 2.13-2 2.13h-7c-1.1 0-2-.95-2-2.13V14.7"></path><path fill="currentColor" d="m12.8 11-2.15-2.15a.5.5 0 1 1 .7-.7L14 10.79a1 1 0 0 1 0 1.42l-2.65 2.64a.5.5 0 0 1-.7-.7L12.79 12H4.5a.5.5 0 0 1 0-1h8.3z"></path></g></svg>
            <p>Выйти</p>
        </div>
        <hr>
        <div class="version">
            <p>v0100</p>
        </div>
    </div>
</div>
